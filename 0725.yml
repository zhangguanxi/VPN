proxy-groups:
  - name: 手动选择
    type: select
    proxies:
      - 全球直连
      - 孟买-Amazon
      - 韩国Amazon
      - 🇩🇪 DE1
      - 🇯🇵 JP
  - name: TG
    type: select
    proxies:
      - 手动选择
      - DIRECT
      - REJECT
  - name: 全球直连
    type: select
    proxies:
      - DIRECT
      - REJECT
  - name: 漏网之鱼
    type: select
    proxies:
      - 手动选择
      - DIRECT
      - 孟买-Amazon
      - 韩国Amazon
      - 🇩🇪 DE1
      - 🇯🇵 JP
      - REJECT
rules:
  # Tabbit 域名直连
  - DOMAIN-SUFFIX,tabbit.ai,全球直连
  - DOMAIN-SUFFIX,tabbit.com,全球直连
  - DOMAIN-SUFFIX,tabbit.org,全球直连
  - DOMAIN-SUFFIX,tabbit.cn,全球直连
  - DOMAIN-SUFFIX,tabbitapp.com,全球直连
  - DOMAIN-SUFFIX,gettabbit.com,全球直连
  # Telegram / TG 相关域名走 TG 代理组
  - DOMAIN-SUFFIX,t.org,TG
  - DOMAIN-SUFFIX,telegram.org,TG
  - DOMAIN-SUFFIX,telesco.pe,TG
  - DOMAIN-SUFFIX,tdesktop.com,TG
  - DOMAIN-SUFFIX,telegra.ph,TG
  - DOMAIN-SUFFIX,telegram.me,TG
  - DOMAIN-SUFFIX,telegram.dog,TG
  - IP-CIDR,91.108.0.0/16,TG,no-resolve
  - IP-CIDR,149.154.0.0/16,TG,no-resolve
  # ===== 新增：中国大陆域名/IP 直连（解决国内网站走漏网之鱼的问题）=====
  # GEOSITE,cn：匹配所有中国大陆域名（需要 Clash Meta / Mihomo 内核支持）
  # GEOIP,cn：匹配所有中国大陆 IP 段
  - GEOSITE,cn,全球直连
  - GEOIP,cn,全球直连
  # 兜底规则：未匹配的流量走"漏网之鱼"
  - MATCH,漏网之鱼
